<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cards Tracker - Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="https://imagedelivery.net/h9fmMoa1o2c2P55TcWJGOg/1c73f150-83b0-47b8-b173-3cdfdb5e4400/public" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='cards_tracker.css') }}" rel="stylesheet">
</head>
<body style="font-family:'Space Grotesk', system-ui, sans-serif; background:#f7f8fc;">
  {% include 'side_bar.html' %}

  <div class="cards-tracker-wrap">
    <div class="mb-3">
      <h3 class="fw-bold mb-1">My Cards Tracker</h3>
      <div class="text-muted">See your card allocations and usage</div>
    </div>

    <div class="ct-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="fw-semibold"><i class="bi bi-credit-card-2-front"></i> Cards</div>
        <span class="ct-subtext">Progress based on sold / given</span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover ct-table mb-0">
          <thead>
            <tr>
              <th>Card</th>
              <th class="text-end">Given</th>
              <th class="text-end">Sold</th>
              <th class="text-end">Left</th>
              <th class="text-end">Progress</th>
            </tr>
          </thead>
          <tbody id="cardsAgentProductsBody">
            <tr><td colspan="5" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.cardsTrackerConfig = {
      role: 'agent',
      endpoints: {
        data: '/agent/cards-tracker/data'
      }
    };
  </script>
  <script src="{{ url_for('static', filename='cards_tracker.js') }}"></script>
</body>
</html>
