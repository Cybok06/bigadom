<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Adom | Recruit Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="https://imagedelivery.net/h9fmMoa1o2c2P55TcWJGOg/1c73f150-83b0-47b8-b173-3cdfdb5e4400/public" type="image/png">
  <style>
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(37,99,235,.16), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(16,185,129,.12), transparent 30rem),
        #f8fafc;
      color:#0f172a;
    }
    .apply-shell{ max-width: 920px; margin: 0 auto; padding: 28px 14px 44px; }
    .apply-hero{
      border:1px solid #e2e8f0;
      border-radius:18px;
      background:rgba(255,255,255,.92);
      box-shadow:0 18px 48px rgba(15,23,42,.08);
      padding:22px;
    }
    .apply-card{
      border:1px solid #e2e8f0;
      border-radius:18px;
      background:white;
      box-shadow:0 18px 48px rgba(15,23,42,.08);
    }
    .form-control,.form-select{ border-radius:12px; }
    .cv-preview{
      width:100%;
      max-height:260px;
      object-fit:contain;
      border:1px dashed #cbd5e1;
      border-radius:14px;
      background:#f8fafc;
      display:none;
    }
  </style>
</head>
<body>
  <main class="apply-shell">
    <section class="apply-hero mb-3">
      <div class="d-flex align-items-center gap-3">
        <img src="https://imagedelivery.net/h9fmMoa1o2c2P55TcWJGOg/1c73f150-83b0-47b8-b173-3cdfdb5e4400/public" alt="Big Adom Enterprise" style="width:145px;height:52px;object-fit:contain;">
        <div>
          <h1 class="h4 mb-1">Recruit Application</h1>
          <p class="text-muted mb-0">Submit your details and CV image for HR review.</p>
        </div>
      </div>
    </section>

    <section class="apply-card p-3 p-md-4">
      <div id="alertBox" class="alert d-none" role="alert"></div>
      <form id="recruitForm" class="row g-3" enctype="multipart/form-data">
        <div class="col-md-6">
          <label class="form-label">Full name</label>
          <input class="form-control" name="full_name" maxlength="120" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone number</label>
          <input class="form-control" name="phone" maxlength="40" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email address</label>
          <input class="form-control" name="email" type="email" maxlength="120">
        </div>
        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input class="form-control" name="location" maxlength="120" required>
        </div>
        <div class="col-12">
          <label class="form-label">Position applying for</label>
          <select class="form-select" name="position_applied" required>
            <option value="">Select role</option>
            <option value="Agent (Sales personnel)">Agent (Sales personnel)</option>
            <option value="Manager">Manager</option>
            <option value="Operations Manager">Operations Manager</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Short note / experience summary</label>
          <textarea class="form-control" name="note" rows="4" maxlength="1200" placeholder="Briefly tell us about your experience."></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">CV image</label>
          <input id="cvInput" class="form-control" name="cv_image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required>
          <div class="form-text">Accepted: JPG, JPEG, PNG, WEBP. Maximum size: 6MB.</div>
          <img id="cvPreview" class="cv-preview mt-3" alt="CV preview">
        </div>
        <div class="col-12 d-flex justify-content-end">
          <button id="submitBtn" class="btn btn-primary px-4" type="submit">
            <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            Submit Application
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('recruitForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const cvInput = document.getElementById('cvInput');
    const cvPreview = document.getElementById('cvPreview');
    const maxSize = 6 * 1024 * 1024;
    const allowed = ['image/jpeg', 'image/png', 'image/webp'];

    function showAlert(type, message){
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    cvInput.addEventListener('change', () => {
      const file = cvInput.files && cvInput.files[0];
      cvPreview.style.display = 'none';
      cvPreview.removeAttribute('src');
      if (!file) return;
      if (!allowed.includes(file.type) || file.size > maxSize) {
        showAlert('warning', 'Please choose a JPG, PNG, or WEBP image under 6MB.');
        cvInput.value = '';
        return;
      }
      cvPreview.src = URL.createObjectURL(file);
      cvPreview.style.display = 'block';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      alertBox.classList.add('d-none');
      const file = cvInput.files && cvInput.files[0];
      if (!file || !allowed.includes(file.type) || file.size > maxSize) {
        showAlert('warning', 'Please upload a JPG, PNG, or WEBP CV image under 6MB.');
        return;
      }
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');
      try {
        const response = await fetch('{{ url_for("hr.public_recruit_submit") }}', {
          method: 'POST',
          body: new FormData(form),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || 'Submission failed.');
        form.reset();
        cvPreview.style.display = 'none';
        showAlert('success', 'Application submitted successfully. HR will review your CV.');
      } catch (error) {
        showAlert('danger', error.message || 'Unable to submit application.');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
